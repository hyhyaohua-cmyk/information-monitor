<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新闻链接监控</title>
  <style>
    :root{--bg:#f4f6f8;--panel:#fff;--ink:#17212b;--muted:#687581;--line:#dfe5ea;--accent:#1769e0;--good:#087f5b;--bad:#c92a2a;--warn:#e67700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:3;background:#17212b;color:#fff;padding:18px max(24px,calc((100vw - 1180px)/2));display:flex;gap:20px;align-items:center;justify-content:space-between;box-shadow:0 2px 12px #0002}.header-info{min-width:280px;max-width:700px;flex:1}h1{font-size:20px;margin:0}.progress-track{display:none;height:5px;margin-top:8px;border-radius:4px;background:#ffffff30;overflow:hidden}.progress-bar{height:100%;width:0;background:#69a7ff;transition:width .35s ease}button{border:0;border-radius:8px;background:var(--accent);color:#fff;padding:10px 18px;font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:wait}main{max-width:1180px;margin:24px auto;padding:0 20px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.card{padding:16px}.card b{display:block;font-size:24px}.card span,.muted{color:var(--muted)}.notice{margin:14px 0;padding:12px 16px;background:#e8f1ff;border-radius:9px;color:#174b91}.tabs{display:flex;gap:6px;margin:20px 0 10px}.tab{background:transparent;color:var(--muted);border:1px solid var(--line)}.tab.active{color:#fff;background:#17212b}.panel{overflow:hidden}.toolbar{position:relative;padding:12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;overflow:visible}input,select{border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff;min-width:180px}.site-picker{position:relative;min-width:180px}.site-picker summary{list-style:none;border:1px solid var(--line);border-radius:7px;padding:8px 32px 8px 10px;background:#fff;cursor:pointer;white-space:nowrap;position:relative}.site-picker summary::-webkit-details-marker{display:none}.site-picker summary:after{content:'▾';position:absolute;right:10px;color:var(--muted)}.picker-menu{position:absolute;z-index:8;top:calc(100% + 6px);left:0;width:260px;max-height:340px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 28px #17212b2b;padding:8px}.picker-all{width:100%;background:#eef4ff;color:#174b91;padding:7px 10px;text-align:left;margin-bottom:5px}.site-option{display:flex;align-items:center;gap:8px;padding:6px 5px;border-radius:5px;cursor:pointer}.site-option:hover{background:#f3f6f9}.site-option input{min-width:0;margin:0}table{width:100%;border-collapse:collapse}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);background:#fafbfc;position:sticky;top:72px}tr:last-child td{border-bottom:0}a{color:#125dbb;text-decoration:none}a:hover{text-decoration:underline}.pill{display:inline-block;border-radius:20px;padding:2px 8px;font-size:12px;background:#e9ecef}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.hidden{display:none}.empty{text-align:center;padding:50px;color:var(--muted)}.url{word-break:break-all;font-size:12px}.title{font-weight:650}.report-meta{white-space:nowrap}@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}header{padding:14px}main{padding:0 10px;margin-top:14px}.toolbar{flex-wrap:wrap}.wide{display:none}table{font-size:13px}th,td{padding:9px 8px}}
  </style><style>.refresh-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.refresh-actions button{padding:9px 13px}.refresh-actions button[data-category="智库"]{background:#7950b3}.refresh-actions button[data-category="央行"]{background:#087f5b}</style>
</head>
<body>
<header><div class="header-info"><h1>信息链接监控</h1><div id="status" style="opacity:.8;font-size:12px">正在读取状态…</div><div id="progressTrack" class="progress-track"><div id="progressBar" class="progress-bar"></div></div></div><div class="refresh-actions"><button class="refresh-category" data-category="新闻">刷新新闻</button><button class="refresh-category" data-category="智库">刷新智库</button><button class="refresh-category" data-category="央行">刷新央行</button></div></header>
<main>
  <section class="summary"><div class="card"><b id="siteCount">—</b><span>监控网站</span></div><div class="card"><b id="channelCount">—</b><span>采集通道</span></div><div class="card"><b id="baselineCount">—</b><span>已建立基线</span></div><div class="card"><b id="newCount">—</b><span>累计新增链接</span></div></section>
  <div class="notice">首次成功读取的每个首页、RSS/Atom 或 sitemap 只建立各自基线，不生成报告。新增报告和刷新历史保留3天；去重指纹会继续保留，同一链接不会因历史清理而重复报告。</div>
  <div class="tabs"><button class="tab active" data-view="reports">新增报告</button><button class="tab" data-view="sites">网站状态</button><button class="tab" data-view="channels">通道详情</button><button class="tab" data-view="runs">刷新记录</button></div>
  <section class="panel" id="reports"><div class="toolbar"><input id="search" placeholder="搜索标题、网址或网站"><select id="categoryFilter"><option value="">全部类别</option><option value="新闻">新闻</option><option value="智库">智库</option><option value="央行">央行</option></select><details id="sitePicker" class="site-picker"><summary id="siteSummary">网站：全部</summary><div class="picker-menu"><button type="button" id="allSites" class="picker-all">查看全部网站</button><div id="siteOptions"></div></div></details><select id="runFilter"><option value="">全部刷新历史</option></select></div><div id="reportBody"></div></section>
  <section class="panel hidden" id="sites"><div id="siteBody"></div></section>
  <section class="panel hidden" id="channels"><div id="channelBody"></div></section>
  <section class="panel hidden" id="runs"><div id="runBody"></div></section>
</main>
<script>
let state={reports:[],sites:[],channels:[],runs:[],refresh:{}},selectedSites=new Set();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const when=s=>s?new Date(s).toLocaleString('zh-CN',{hour12:false}):'—';const duration=ms=>{if(!Number.isFinite(ms)||ms<0)return'—';const total=Math.floor(ms/1000),h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60;return h?`${h}小时${m}分${s}秒`:m?`${m}分${s}秒`:`${s}秒`};
async function load(){try{state=await fetch('/api/state').then(r=>r.json());render();if(state.refresh.running)setTimeout(load,1500)}catch(e){document.querySelector('#status').textContent='读取失败：'+e.message}}
function render(){const c=state.channels.length,b=state.channels.filter(x=>x.baseline_at).length,selectedRun=runFilter.value,active=state.refresh.running,last=state.runs[0];siteCount.textContent=state.sites.length;channelCount.textContent=c;baselineCount.textContent=b;newCount.textContent=state.reports.length;if(active){const elapsed=Date.now()-new Date(state.refresh.started_at).getTime(),counts=state.refresh.total?` · ${state.refresh.completed}/${state.refresh.total} · ${state.refresh.percent}%`:'';status.textContent=`${state.refresh.message}${counts} · 已耗时 ${duration(elapsed)}`;progressTrack.style.display='block';progressBar.style.width=`${state.refresh.percent||0}%`}else{status.textContent=last?.finished_at?`完成：${when(last.finished_at)} · 耗时 ${duration(new Date(last.finished_at)-new Date(last.started_at))}`:'尚未刷新';progressTrack.style.display='none';progressBar.style.width='0%'}document.querySelectorAll('.refresh-category').forEach(button=>button.disabled=active);
 siteOptions.innerHTML=state.sites.map(s=>`<label class="site-option"><input type="checkbox" data-site="${esc(s.id)}" ${selectedSites.has(s.id)?'checked':''}><span>${esc(s.name)}</span></label>`).join('');siteOptions.querySelectorAll('input').forEach(box=>box.onchange=()=>{box.checked?selectedSites.add(box.dataset.site):selectedSites.delete(box.dataset.site);updateSiteSummary();renderReports()});updateSiteSummary();
 runFilter.innerHTML='<option value="">全部刷新历史</option>'+state.runs.map(r=>`<option value="${esc(r.id)}">【${esc(r.category||'新闻')}】${when(r.started_at)} · 新增 ${r.new_count}</option>`).join('');runFilter.value=selectedRun;renderReports();
 siteBody.innerHTML=table(['类别','网站','基线/通道','错误','最近成功'],state.sites.map(s=>[`<span class="pill">${esc(s.category)}</span>`,`<a href="${esc(s.home_url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a>`,`${s.baseline_count||0} / ${s.channel_count||0}`,s.error_count?`<span class="bad">${s.error_count}</span>`:'<span class="good">0</span>',when(s.last_ok_at)]));
 channelBody.innerHTML=table(['网站 / 类型','状态','条目数','地址 / 最近错误'],state.channels.map(x=>[`${esc(x.site_name)}<br><span class="pill">${esc(x.category)}</span> <span class="pill">${esc(x.kind)}</span>`,x.baseline_at?'<span class="good">已建立基线</span>':'<span class="warn">等待首次成功</span>',x.last_count,`<a class="url" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a>${x.last_error?`<br><span class="bad">${esc(x.last_error)}</span>`:''}`]));
 runBody.innerHTML=table(['类别','开始时间','耗时','状态','新增','成功 / 失败通道'],state.runs.map(x=>[`<span class="pill">${esc(x.category||'新闻')}</span>`,when(x.started_at),x.finished_at?duration(new Date(x.finished_at)-new Date(x.started_at)):'进行中',esc(x.status),x.new_count,`${x.ok_count} / ${x.error_count}`]));}
function table(head,rows){if(!rows.length)return '<div class="empty">暂无记录</div>';return `<table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function updateSiteSummary(){siteSummary.textContent=selectedSites.size?`网站：已选 ${selectedSites.size} 个`:'网站：全部'}
function renderReports(){const q=search.value.trim().toLowerCase(),rid=runFilter.value,category=categoryFilter.value;const rows=state.reports.filter(x=>(!category||x.category===category)&&(!selectedSites.size||selectedSites.has(x.site_id))&&(!rid||x.run_id===rid)&&(!q||`${x.title_zh} ${x.title} ${x.url} ${x.site_name}`.toLowerCase().includes(q))).map(x=>[`<div class="title"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title_zh||x.title||'标题暂不可用')}</a></div>${x.title&&x.title!==x.title_zh?`<div>${esc(x.title)}</div>`:''}<div class="url muted"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a></div>${x.enrich_error?`<div class="warn" style="font-size:12px">${esc(x.enrich_error)}</div>`:''}`,`<span class="report-meta">${esc(x.site_name)}</span><br><span class="pill">${esc(x.category)}</span> ${x.channels.map(c=>`<span class="pill">${esc(c)}</span>`).join(' ')}`,when(x.created_at)]);reportBody.innerHTML=table(['中文标题 / 原标题 / 链接','来源','发现时间'],rows)}
document.querySelectorAll('.refresh-category').forEach(button=>button.onclick=async()=>{document.querySelectorAll('.refresh-category').forEach(x=>x.disabled=true);const category=button.dataset.category;status.textContent=`正在启动【${category}】刷新…`;await fetch('/api/refresh?category='+encodeURIComponent(category),{method:'POST'});load()});search.oninput=renderReports;categoryFilter.onchange=renderReports;runFilter.onchange=renderReports;allSites.onclick=()=>{selectedSites.clear();siteOptions.querySelectorAll('input').forEach(x=>x.checked=false);updateSiteSummary();renderReports()};document.addEventListener('click',e=>{if(!sitePicker.contains(e.target))sitePicker.removeAttribute('open')});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['reports','sites','channels','runs'].forEach(id=>document.querySelector('#'+id).classList.toggle('hidden',id!==b.dataset.view))});load();
</script></body></html>
